<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Alex Braise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(135deg, var(--color-dark), var(--color-dark-soft));
  }

  .admin-card {
    width: 100%;
    max-width: 560px;
    background: var(--color-cream);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 40px;
  }

  .admin-card h1 {
    font-family: var(--font-heading);
    font-size: 1.4rem;
    margin-bottom: 6px;
  }

  .admin-card p.admin-sub {
    font-size: 0.9rem;
    color: var(--color-dark-soft);
    opacity: 0.75;
    margin-bottom: 28px;
  }

  .admin-field {
    margin-bottom: 20px;
  }

  .admin-field label {
    display: block;
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 8px;
    color: var(--color-dark-soft);
  }

  .admin-field input,
  .admin-field textarea {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.95rem;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 2px solid rgba(28, 20, 16, 0.12);
    background: #fff;
    color: var(--color-dark);
    resize: vertical;
  }

  .admin-field textarea {
    min-height: 90px;
    line-height: 1.5;
  }

  .admin-field input:focus,
  .admin-field textarea:focus {
    outline: none;
    border-color: var(--color-gold);
  }

  .admin-btn {
    width: 100%;
    margin-top: 6px;
  }

  .admin-status {
    margin-top: 16px;
    font-size: 0.9rem;
    font-weight: 600;
    min-height: 1.2em;
  }

  .admin-status.ok { color: #2f7d3a; }
  .admin-status.err { color: var(--color-red); }
  .admin-status.warn { color: var(--color-orange); }

  #admin-login { text-align: center; }

  #admin-editor { display: none; }

  .admin-logout {
    display: block;
    text-align: center;
    margin-top: 22px;
    font-size: 0.85rem;
    color: var(--color-dark-soft);
    opacity: 0.7;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="admin-card">

  <div id="admin-login">
    <h1>Accès Admin</h1>
    <p class="admin-sub">Entrez le mot de passe pour modifier la bannière du site.</p>
    <div class="admin-field">
      <label for="admin-password">Mot de passe</label>
      <input type="password" id="admin-password" inputmode="numeric" autocomplete="off" placeholder="••••">
    </div>
    <button type="button" class="btn btn-primary admin-btn" id="admin-login-btn">Entrer</button>
    <div class="admin-status err" id="admin-login-status"></div>
  </div>

  <div id="admin-editor">
    <h1>Bannière défilante</h1>
    <p class="admin-sub">Ce texte défile en bas de la page d'accueil (alexbraise.com). Modifiez-le ici, il se met à jour pour tous les visiteurs.</p>

    <div class="admin-field">
      <label for="banner-fr">Message en Français</label>
      <textarea id="banner-fr" placeholder="Chargement..."></textarea>
    </div>

    <div class="admin-field">
      <label for="banner-en">Message en Anglais</label>
      <textarea id="banner-en" placeholder="Loading..."></textarea>
    </div>

    <button type="button" class="btn btn-primary admin-btn" id="admin-save-btn">Enregistrer</button>
    <div class="admin-status" id="admin-save-status"></div>

    <span class="admin-logout" id="admin-logout-btn">Se déconnecter</span>
  </div>

</div>

<script>
  // Fill these in once the Firebase project exists (must match script.js).
  const FIREBASE_PROJECT_ID = 'PASTE_YOUR_PROJECT_ID_HERE';
  const FIREBASE_API_KEY = 'PASTE_YOUR_WEB_API_KEY_HERE';
  const FIREBASE_READY = !FIREBASE_PROJECT_ID.startsWith('PASTE_') && !FIREBASE_API_KEY.startsWith('PASTE_');
  const BANNER_DOC_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents/siteContent/banner?key=${FIREBASE_API_KEY}`;

  const ADMIN_PASSWORD = '7532';
  const SESSION_KEY = 'alexbraise_admin_unlocked';

  const DEFAULT_BANNER_MESSAGES = {
    fr: "Aujourd'hui, nous célébrons un an de plus pour notre PDG ! Un homme généreux, visionnaire et dévoué, qui porte Alex Braise avec passion et bienveillance chaque jour. Joyeux anniversaire, Patron ! N'oubliez pas que les tickets de Ndolo L'amour sont toujours disponibles chez Alex Braise à 8000 FCFA seulement au lieu de 10 000 FCFA !",
    en: "Today we celebrate another year of our CEO! A generous, visionary and dedicated man who leads Alex Braise with passion and kindness every single day. Happy Birthday, Boss! Don't forget, Ndolo L'amour tickets are still available at Alex Braise for only 8000 FCFA instead of 10,000 FCFA!",
  };

  const loginScreen = document.getElementById('admin-login');
  const editorScreen = document.getElementById('admin-editor');
  const passwordInput = document.getElementById('admin-password');
  const loginBtn = document.getElementById('admin-login-btn');
  const loginStatus = document.getElementById('admin-login-status');
  const frField = document.getElementById('banner-fr');
  const enField = document.getElementById('banner-en');
  const saveBtn = document.getElementById('admin-save-btn');
  const saveStatus = document.getElementById('admin-save-status');
  const logoutBtn = document.getElementById('admin-logout-btn');

  const setSaveStatus = (text, kind) => {
    saveStatus.textContent = text;
    saveStatus.className = 'admin-status' + (kind ? ' ' + kind : '');
  };

  const loadCurrentMessages = async () => {
    // Local fallback so the form is never empty, even before Firebase is wired up.
    const local = JSON.parse(localStorage.getItem('alexbraise_banner_local') || 'null');
    frField.value = (local && local.fr) || DEFAULT_BANNER_MESSAGES.fr;
    enField.value = (local && local.en) || DEFAULT_BANNER_MESSAGES.en;

    if (!FIREBASE_READY) {
      setSaveStatus('Stockage en ligne non configuré — les modifications ne seront visibles que dans ce navigateur. Voir script.js.', 'warn');
      return;
    }

    try {
      const res = await fetch(BANNER_DOC_URL);
      if (!res.ok) return;
      const doc = await res.json();
      if (doc?.fields?.fr?.stringValue) frField.value = doc.fields.fr.stringValue;
      if (doc?.fields?.en?.stringValue) enField.value = doc.fields.en.stringValue;
    } catch (err) {
      setSaveStatus('Impossible de récupérer la version en ligne pour le moment.', 'err');
    }
  };

  const saveMessages = async () => {
    const fr = frField.value.trim();
    const en = enField.value.trim();

    if (!fr || !en) {
      setSaveStatus('Les deux champs doivent être remplis.', 'err');
      return;
    }

    localStorage.setItem('alexbraise_banner_local', JSON.stringify({ fr, en }));

    if (!FIREBASE_READY) {
      setSaveStatus('Enregistré dans ce navigateur uniquement (stockage en ligne non configuré).', 'warn');
      return;
    }

    saveBtn.disabled = true;
    setSaveStatus('Enregistrement...', '');

    try {
      const res = await fetch(`${BANNER_DOC_URL}&updateMask.fieldPaths=fr&updateMask.fieldPaths=en`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: { fr: { stringValue: fr }, en: { stringValue: en } } }),
      });
      if (!res.ok) throw new Error('request failed');
      setSaveStatus('Enregistré ✓ — visible pour tous les visiteurs.', 'ok');
    } catch (err) {
      setSaveStatus('Erreur lors de l\'enregistrement. Réessayez.', 'err');
    } finally {
      saveBtn.disabled = false;
    }
  };

  const unlock = () => {
    loginScreen.style.display = 'none';
    editorScreen.style.display = 'block';
    loadCurrentMessages();
  };

  loginBtn.addEventListener('click', () => {
    if (passwordInput.value === ADMIN_PASSWORD) {
      sessionStorage.setItem(SESSION_KEY, '1');
      loginStatus.textContent = '';
      unlock();
    } else {
      loginStatus.textContent = 'Mot de passe incorrect.';
    }
  });

  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginBtn.click();
  });

  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem(SESSION_KEY);
    editorScreen.style.display = 'none';
    loginScreen.style.display = 'block';
    passwordInput.value = '';
  });

  saveBtn.addEventListener('click', saveMessages);

  if (sessionStorage.getItem(SESSION_KEY) === '1') unlock();
</script>

</body>
</html>
